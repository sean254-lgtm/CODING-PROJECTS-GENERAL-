<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="job-application-form.css">
</head>
<body>
    <div class="container">
        <h1>Job Application Form</h1>
        <form action="https://www.linkedin.com/feed/" method="POST">
            <label for="name">Full Name: </label>
            <input type="text" id="name" placeholder="Enter your name" required>
            <label for="email">Email: </label>
            <input type="email" id="email" placeholder="Enter your email" required>
            <label for="position">Position: </label>
            <select id="position" required>
                <option value="" selected disabled>Select a position</option>
                <option value="developer">Developer</option>
                <option value="designer">Designer</option>
                <option value="manager">Manager</option>
            </select>
            <fieldset class="radio-group">
                <legend>Availability: </legend>
                <input type="radio" name="availability" id="availability" required>
                <label for="availability">Full-time</label>
                <input type="radio" name="availability" id="availability" checkedrequired>
                <label for="availability">Part-time</label>
            </fieldset>
            <label for="message">Why do you want this job?</label>
            <textarea id="message" rows="5" cols="30" placeholder="Write your motivation" required></textarea>
            <button type="submit">Apply</button>
        </form>
    </div>
</body>
</html>
